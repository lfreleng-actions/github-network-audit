# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Runs on a tag push: builds, tests and promotes the GitHub release.
#
# This project publishes GitHub releases only; it does not publish a
# package to PyPI, so no trusted-publishing jobs are required here. The
# reusable `release` job builds, tests, audits, attaches artefacts and
# promotes the draft release.
name: 'Python Build/Test/Release'

# yamllint disable-line rule:truthy
on:
  # Trigger on tag push events
  push:
    tags:
      - '**'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 'Build/Test/Release'
    permissions:
      contents: write       # Create the GitHub release / attach assets
      id-token: write       # OIDC for build provenance attestations
      attestations: write   # Build provenance attestations
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/python-workflows/.github/workflows/build-test-release.yaml@b29621b4859bf5b6fbd7202977cd73334f54e29d  # v0.4.0
