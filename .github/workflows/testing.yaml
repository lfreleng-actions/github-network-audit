---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Connection allowlist validation workflow
#
# This workflow exercises the allowlist produced for lfreleng-actions
# against a locked-down harden-runner configuration. It verifies that:
#
#   * every endpoint listed in `vars.TEST_PERMITTED` is reachable, and
#   * every endpoint listed in `vars.TEST_DENIED` is blocked.
#
# The egress allow-list is loaded out-of-band from the organisation's
# `.github` repository by `lfreleng-actions/harden-runner-block-action`,
# which fetches the pinned `allow_list.txt`, strips its `#` comments,
# collapses all whitespace into the single space-separated string
# harden-runner's `allowed-endpoints` input expects, and publishes it
# as `$CONNECTION_ALLOW_LIST`. The subsequent `step-security/harden-runner`
# step consumes that value in `block` egress mode. Loading the list
# out-of-band means the workflow no longer depends on any org- or
# repo-level GitHub variable holding the allow-list, so it also works
# for pull requests raised from forks.
#
# The heavy lifting happens in `scripts/connection_test.py`, an
# asyncio-based probe harness that:
#
#   * runs all probes in parallel with a hard wall-clock cap,
#   * cancels immediately on SIGTERM/SIGINT (step cancellation works), and
#   * derives expected pass/fail counts from the number of parsed
#     target tokens (typically one per input line, but blank lines,
#     full-line ``#`` comments and inline ``# comment`` trailers are
#     tolerated), so the variables are freely extensible without
#     editing the workflow.
#
# Expected variables (configure at repo or org level):
#
#   TEST_PERMITTED
#     One `host:port` entry per line. MUST be a subset of the egress
#     allow-list; each entry is expected to connect. Repository
#     variables are not exposed to fork pull requests, so the PERMITTED
#     test skips itself when the variable is unavailable.
#
#   TEST_DENIED
#     One `host:port` entry per line. MUST NOT appear in the egress
#     allow-list; each entry is expected to be blocked. Repository
#     variables are not exposed to fork pull requests, so the DENIED
#     test skips itself when the variable is unavailable.
#
# Note: VEXXHOST CIDR blocks are intentionally NOT consumed by this
# workflow. harden-runner's `allowed-endpoints` input is DNS-based
# and does not accept CIDRs, so there is nothing to validate
# automatically. See `resources/VEXXHOST.txt` and the README for
# guidance on manual verification of blocked egress against
# AS33028 ranges.

name: "Test Network Connections 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # ---------------------------------------------------------------
  # Positive test: allowlisted endpoints MUST be reachable
  # ---------------------------------------------------------------
  positive-connection-tests:
    name: "Test PERMITTED"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Script has its own 60s overall cap; 3 min is generous headroom
    # for the harden-runner agent install and repo checkout.
    timeout-minutes: 3
    steps:
      # Load the egress allow-list out-of-band from the organisation's
      # .github repository and publish it as $CONNECTION_ALLOW_LIST for
      # the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: '@04fee5dc9ba10cb0c6c891034741a2011482c3a2'  # v0.6.2

      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Run permitted connection tests"
        shell: bash
        env:
          TEST_PERMITTED: ${{ vars.TEST_PERMITTED }}
        run: |
          set -u
          # Repository variables are not exposed to fork pull requests,
          # so skip (rather than hard-fail) when the probe targets are
          # unavailable. The test still runs on push, workflow_dispatch
          # and internal / Dependabot PRs, where the variable is set.
          if [ -z "${TEST_PERMITTED:-}" ]; then
            echo "::notice::TEST_PERMITTED not set (fork PR?); skipping"
            exit 0
          fi
          python3 scripts/connection_test.py \
            --mode permitted \
            --targets-env TEST_PERMITTED \
            --connect-timeout 5 \
            --max-attempts 3 \
            --overall-timeout 60

  # ---------------------------------------------------------------
  # Negative test: non-allowlisted endpoints MUST be blocked
  # ---------------------------------------------------------------
  negative-connection-tests:
    name: "Test DENIED"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      # Load the egress allow-list out-of-band from the organisation's
      # .github repository and publish it as $CONNECTION_ALLOW_LIST for
      # the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2a70c3284392b8d6ee85a509dd4e9818801a7e82  # v0.11.1
        with:
          config: '@04fee5dc9ba10cb0c6c891034741a2011482c3a2'  # v0.6.2

      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Run denied connection tests"
        shell: bash
        env:
          TEST_DENIED: ${{ vars.TEST_DENIED }}
        run: |
          set -u
          # Repository variables are not exposed to fork pull requests,
          # so skip (rather than hard-fail) when the probe targets are
          # unavailable. The test still runs on push, workflow_dispatch
          # and internal / Dependabot PRs, where the variable is set.
          if [ -z "${TEST_DENIED:-}" ]; then
            echo "::notice::TEST_DENIED not set (fork PR?); skipping"
            exit 0
          fi
          python3 scripts/connection_test.py \
            --mode denied \
            --targets-env TEST_DENIED \
            --connect-timeout 5 \
            --max-attempts 1 \
            --overall-timeout 30
